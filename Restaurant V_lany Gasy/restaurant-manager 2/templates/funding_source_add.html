{% extends "base.html" %}
{% block title %}Ajouter une source de financement{% endblock %}
{% block page_title %}Ajouter une source de financement{% endblock %}
{% block content %}
<h1 class="h3 mb-3">➕ Ajouter une source de financement</h1>

<form method="POST" class="card shadow-sm p-4" style="max-width:500px">
  <div class="mb-3">
    <label class="form-label">Nom</label>
    <input type="text" name="name" class="form-control" placeholder="Ex : Caisse principale, Apport Patron..." required>
  </div>
  <div class="mb-3">
    <label class="form-label">Apport initial (Ar)</label>
    <input type="number" step="0.01" name="initial_balance" class="form-control" value="0">
  </div>
  <div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{{ url_for('purchases.funding_source_list') }}" class="btn btn-link">Retour</a>
  </div>
</form>
{% endblock %}
